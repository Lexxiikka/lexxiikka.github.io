<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Имени шизы Лексики</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Underdog&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Underdog', 'Calibri';
        }

        .home-theme #profile-block {
            border-color: #7c00ff;
        }

        .profile-container::after {
            background: radial-gradient(circle at 10px 10px,
                    var(--primary-color, #ab0c34) 23%,
                    transparent 15%);
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1.2s ease-in-out;
        }

        .hidden {
            display: none !important;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-icon {
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            color: white;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        .bottom-controls {
            position: fixed;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 20;
        }

        .voice-control-wrapper {
            position: relative;
            padding: 2px;
            background: linear-gradient(to right bottom, #2674df, #a61fd3);
            border-radius: 20px;
        }

        .voice-control {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 820px;
            min-height: 332px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform-style: preserve-3d;
            pointer-events: auto;
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .profile-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .profile-container::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            animation: orbit 3s linear infinite;
            z-index: -1;
            filter: blur(7px);
            box-shadow: none;
        }

        .profile-container.fast-orbit::after {
            animation: fast-orbit 0.5s linear forwards;
        }

        .profile-picture {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .name-and-badges {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
            margin-bottom: 10px;
        }

        #profile-name {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #fff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            opacity: 1 !important;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge-container {
            position: relative;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .badge-container .tooltip {
            visibility: hidden;
            width: 120px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .badge-container:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        .badge-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px;
            border-radius: 15px;
            display: inline-block;
        }

        .badge-box-inner {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 12px;
            display: flex;
            gap: 8px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .badge {
            width: 22px;
            height: 22px;
            transition: transform 0.3s;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .badge:hover {
            transform: scale(1.2);
        }

        #profile-bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 10px;
            opacity: 1 !important;
        }

        .bio-separator {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 20px 0;
            opacity: 1 !important;
        }

        .profile-footer {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            margin-top: auto;
        }

        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            align-self: flex-start;
            position: relative;
            pointer-events: auto;
            opacity: 1 !important;
            width: 110px;
        }

        .visitor-icon {
            width: 18px;
            height: 18px;
            color: white;
            opacity: 1 !important;
        }

        .visitor-counter .tooltip {
            visibility: hidden;
            width: 130px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            top: -35px;
            left: 50%;
            margin-left: -63px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .visitor-counter:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        #visitor-count {
            opacity: 1 !important;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 0;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-icon {
            width: 36px;
            height: 36px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-icon:hover {
            transform: scale(1.4) rotateY(15deg);
        }

        .round {
            border-radius: 30%;
        }

        .glitch {
            animation: glitch 0.2s ease-in-out;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 2px);
            }

            40% {
                transform: translate(-2px, -2px);
            }

            60% {
                transform: translate(2px, 2px);
            }

            80% {
                transform: translate(2px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fast-orbit {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
        }

        #start-text {
            font-size: 24px;
            color: #fff;
            text-align: center;
        }

        .music-btn-wrapper {
            position: relative;
            display: inline-flex;
        }

        .music-btn-wrapper .music-loading-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 35;
        }

        .music-btn-wrapper .music-loading-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.85) transparent transparent transparent;
        }

        .music-btn-wrapper .music-loading-tooltip.visible {
            opacity: 1;
        }

        .more-music-btn {
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .more-music-btn img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .more-music-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        #debug-time-display {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            user-select: none;
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(0, 255, 0, 0.4);
            transition: border-color 0.2s, box-shadow 0.2s;
            min-width: 150px;
            justify-content: center;
        }

        #debug-time-display:hover {
            border-color: rgba(0, 255, 0, 0.8);
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.3);
        }

        .debug-seek-btn {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .debug-seek-btn:hover {
            background: rgba(0, 255, 0, 0.25);
        }

        .debug-seek-btn:active {
            transform: scale(0.95);
        }

        #debug-time-text {
            cursor: pointer;
            min-width: 90px;
            text-align: center;
        }

        #debug-seek-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(0, 255, 0, 0.4);
            border-radius: 12px;
            padding: 24px 28px;
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: stretch;
            gap: 14px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.15);
            min-width: 280px;
        }

        #debug-seek-modal.open {
            display: flex;
        }

        #debug-seek-modal .modal-title {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: rgba(0, 255, 0, 0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        #debug-seek-modal input {
            font-family: 'Courier New', monospace;
            font-size: 22px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 6px;
            color: #0f0;
            padding: 8px 14px;
            width: 100%;
            text-align: center;
            outline: none;
            letter-spacing: 2px;
            transition: border-color 0.2s;
        }

        #debug-seek-modal input:focus {
            border-color: rgba(0, 255, 0, 0.8);
        }

        #debug-seek-modal input::placeholder {
            color: rgba(0, 255, 0, 0.25);
        }

        #debug-seek-modal .modal-hint {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: rgba(0, 255, 0, 0.35);
            text-align: center;
        }

        .debug-subs-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: rgba(0, 255, 0, 0.6);
            cursor: pointer;
            user-select: none;
            width: 100%;
            justify-content: flex-start;
        }

        .debug-subs-toggle input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #0f0;
            cursor: pointer;
        }

        #debug-seek-modal .modal-actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        #debug-seek-modal .modal-actions button {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 6px;
            color: #0f0;
            padding: 6px 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #debug-seek-modal .modal-actions button:hover {
            background: rgba(0, 255, 0, 0.2);
        }

        #debug-seek-modal .modal-actions button.cancel {
            color: rgba(255, 80, 80, 0.7);
            border-color: rgba(255, 80, 80, 0.3);
        }

        #debug-seek-modal .modal-actions button.cancel:hover {
            background: rgba(255, 80, 80, 0.15);
        }

        #music-player-panel {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            width: 500px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 25;
            border-color: #7c00ff;
        }

        #music-player-panel.slide-up {
            transform: translateX(-50%) translateY(0);
        }

        .player-left {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .track-info {
            text-align: left;
        }

        #track-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #fff;
        }

        #track-artist {
            font-size: 1em;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .player-right {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .player-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .player-controls button {
            background: transparent;
            border: none;
            width: 45px;
            height: 45px;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .player-controls button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .player-controls button:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .player-controls #play-pause-btn {
            width: 55px;
            height: 55px;
        }

        .player-volume {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-volume .volume-img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .player-volume input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #6764f0, #da91e6);
            outline: none;
            cursor: pointer;
            margin: 0;
            padding: 0;
        }

        .player-volume input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
        }

        .player-volume input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
        }

        .player-volume input[type="range"]::-moz-range-track {
            background: #9810f6;
            height: 6px;
            border-radius: 3px;
            border: none;
        }

        .player-volume input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
        }

        #back-btn {
            position: fixed;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            width: 820px;
            height: 50px;
            padding: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
            z-index: 25;
            display: flex;
            align-items: start;
            justify-content: center;
            border-color: #7c00ff;
        }

        #back-btn.slide-up {
            transform: translateX(-50%) translateY(0);
        }

        #back-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        #back-btn img {
            width: 35px;
            height: 35px;
            object-fit: contain;
            transition: transform 0.3s, opacity 0.3s;
        }

        #back-btn:hover img {
            transform: scale(1.1);
            opacity: 0.8;
        }

        #subtitles-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            pointer-events: none;
        }

        #subtitles-text {
            font-size: 40px;
            color: #fff;
            text-align: center;
            max-width: 80%;
            padding: 20px 15px;
            text-shadow:
                0 0 10px rgba(124, 0, 255, 0.8),
                0 0 20px rgba(124, 0, 255, 0.5),
                0 0 40px rgba(124, 0, 255, 0.3),
                0 0 80px rgba(124, 0, 255, 0.1);
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            transition: none;
            letter-spacing: 2px;
            line-height: 1.6;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(124, 0, 255, 0.2);
        }

        #subtitles-text.show {
            animation: subsFadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        #subtitles-text.hide {
            animation: subsFadeOut 0.3s cubic-bezier(0.55, 0, 1, 0.45) forwards;
        }

        @keyframes subsFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
                filter: blur(10px);
            }

            60% {
                filter: blur(0px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes subsFadeOut {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }

            100% {
                opacity: 0;
                transform: scale(1.1) translateY(-20px);
                filter: blur(6px);
            }
        }

        @media (max-width: 700px) {
            * {
                display: none;
            }
        }
    </style>
</head>

<body class="home-theme">
    <div id="start-screen">
        <div id="start-text">Идет подгрузка контента страницы, 0%</div>
    </div>
    <div class="container">
        <div id="bg-container">
            <video id="bg-video-1" class="bg-video" autoplay muted loop playsinline preload="auto"></video>
            <video id="bg-video-2" class="bg-video" autoplay muted loop playsinline preload="auto"
                style="opacity: 0;"></video>
        </div>

        <div id="profile-block">
            <div class="profile-header">
                <div class="profile-container">
                    <img src="assets/profile.png" alt="Profile" class="profile-picture">
                </div>
                <div class="profile-info">
                    <div class="name-and-badges">
                        <div id="profile-name">Lexxikka</div>
                        <div class="badge-box">
                            <div class="badge-box-inner">
                                <div class="badge-group">
                                    <div class="badge-container">
                                        <img src="assets/developer.png" alt="Developer" class="badge">
                                        <span class="tooltip">Разработчик</span>
                                    </div>
                                    <div class="badge-container">
                                        <img src="assets/1c.png" alt="1c" class="badge">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        let musicList = [];
        let names = [];
        let quotes = [];

        async function loadMusicConfig() {
            try {
                const response = await fetch('music_config.json', { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} ${response.statusText}`);
                }
                const data = await response.json();
                if (!Array.isArray(data)) {
                    throw new Error('music_config.json должен содержать массив треков');
                }
                musicList = data;
                console.log(`[music_config] Загружено треков: ${musicList.length}`);
            } catch (err) {
                console.error('[music_config] Ошибка загрузки music_config.json:', err);
                musicList = [];
            }
        }

        async function loadTextConfig() {
            try {
                const response = await fetch('text_config.json', { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} ${response.statusText}`);
                }
                const data = await response.json();
                names = Array.isArray(data.names) ? data.names : [];
                quotes = Array.isArray(data.quotes) ? data.quotes : [];
                console.log(`[text_config] Имён: ${names.length}, цитат: ${quotes.length}`);
            } catch (err) {
                console.error('[text_config] Ошибка загрузки text_config.json:', err);
                names = ["Lexxikka"];
                quotes = ["..."];
            }
        }

        let profileAssetsLoaded = false;
        let musicAssetsLoaded = false;
        let totalProfileAssets = 0;
        let loadedProfileAssets = 0;
        let totalMusicAssets = 0;
        let loadedMusicAssets = 0;

        function initMedia() {
            const backgroundMusic = document.getElementById('background-music');
            if (!backgroundMusic) {
                console.error("Media elements not found");
                return;
            }
            if (!backgroundMusic.src || backgroundMusic.src === window.location.href) {
                backgroundMusic.src = 'assets/music_main.mp3';
            }
            backgroundMusic.volume = 0.3;
        }

        function trackProfileAssetLoad() {
            loadedProfileAssets++;
            const loadingPercent = Math.floor((loadedProfileAssets / totalProfileAssets) * 100);
            const startText = document.getElementById('start-text');
            if (startText && !profileAssetsLoaded) {
                startText.textContent = `Идет подгрузка контента страницы ${loadingPercent}%`;
            }
            if (loadedProfileAssets >= totalProfileAssets) {
                profileAssetsLoaded = true;
                startText.textContent = 'Ну же, один клик во имя повелителя. . .';

                const preloadContainer = document.getElementById('preload-container');
                if (preloadContainer) {
                    preloadContainer.querySelectorAll('video, audio').forEach(el => {
                        el.removeAttribute('src');
                        el.load();
                    });
                    preloadContainer.remove();
                }

                preloadMusicAssets();
            }
        }

        function trackMusicAssetLoad() {
            loadedMusicAssets++;
            if (loadedMusicAssets >= totalMusicAssets) {
                musicAssetsLoaded = true;
                const tooltip = document.getElementById('music-loading-tooltip');
                if (tooltip) {
                    tooltip.classList.remove('visible');
                    tooltip.classList.add('hidden');
                }
            }
        }

        function preloadProfileAssets() {
            const profileAssets = [
                'assets/music_main.mp3',
                'assets/profile.png',
                'assets/developer.png',
                'assets/1c.png',
                'assets/py.png',
                'assets/js.png',
                'assets/owner.gif',
                'assets/aal.png',
                'assets/staff.gif',
                'assets/telegram.png',
                'assets/telegram_group.png',
                'assets/discord.png',
                'assets/youtube.png',
                'assets/steam.png',
                'assets/itd.png',
                'assets/blog.png',
                'assets/icon.png'
            ];
            totalProfileAssets = profileAssets.length + 1;
            const preloadContainer = document.createElement('div');
            preloadContainer.style.display = 'none';
            preloadContainer.id = 'preload-container';
            document.body.appendChild(preloadContainer);

            profileAssets.forEach(src => {
                if (src.endsWith('.mp4')) {
                    const video = document.createElement('video');
                    video.preload = 'auto';
                    video.muted = true;
                    video.src = src;
                    video.onloadeddata = trackProfileAssetLoad;
                    video.onerror = trackProfileAssetLoad;
                    preloadContainer.appendChild(video);
                } else if (src.endsWith('.mp3')) {
                    const audio = document.createElement('audio');
                    audio.preload = 'auto';
                    audio.src = src;
                    audio.onloadeddata = trackProfileAssetLoad;
                    audio.onerror = trackProfileAssetLoad;
                    preloadContainer.appendChild(audio);
                } else {
                    const img = new Image(); img.src = src;
                    img.onload = trackProfileAssetLoad; img.onerror = trackProfileAssetLoad;
                }
            });
        }

        function preloadMusicAssets() {
            const musicAssets = [
                'assets/player.png',
                'assets/return.png',
                'assets/play.png',
                'assets/pause.png',
                'assets/next.png',
                'assets/voice.png',
            ];
            musicList.forEach(track => {
                if (track.audio) musicAssets.push(track.audio);
                if (track.bg) musicAssets.push(track.bg);
            });
            totalMusicAssets = musicAssets.length;

            let preloadContainer = document.getElementById('preload-container');
            if (!preloadContainer) {
                preloadContainer = document.createElement('div');
                preloadContainer.style.display = 'none';
                preloadContainer.id = 'preload-container';
                document.body.appendChild(preloadContainer);
            }

            musicAssets.forEach(src => {
                if (src.endsWith('.mp4')) {
                    const video = document.createElement('video');
                    video.preload = 'auto';
                    video.muted = true;
                    video.src = src;
                    video.onloadeddata = trackMusicAssetLoad;
                    video.onerror = trackMusicAssetLoad;
                    preloadContainer.appendChild(video);
                } else if (src.endsWith('.mp3')) {
                    const audio = document.createElement('audio');
                    audio.preload = 'auto';
                    audio.src = src;
                    audio.onloadeddata = trackMusicAssetLoad;
                    audio.onerror = trackMusicAssetLoad;
                    preloadContainer.appendChild(audio);
                } else {
                    const img = new Image(); img.src = src;
                    img.onload = trackMusicAssetLoad; img.onerror = trackMusicAssetLoad;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([loadMusicConfig(), loadTextConfig()]);

            initMedia();
            const startScreen = document.getElementById('start-screen');
            const startText = document.getElementById('start-text');
            const profileName = document.getElementById('profile-name');
            const profileBio = document.getElementById('profile-bio');
            const visitorCount = document.getElementById('visitor-count');
            const backgroundMusic = document.getElementById('background-music');
            const volumeIcon = document.getElementById('volume-icon');
            const volumeSlider = document.getElementById('volume-slider');
            const profileBlock = document.getElementById('profile-block');
            const profilePicture = document.querySelector('.profile-picture');
            const profileContainer = document.querySelector('.profile-container');
            const playPauseIcon = document.getElementById('play-pause-icon');
            const musicLoadingTooltip = document.getElementById('music-loading-tooltip');
            const bottomControls = document.querySelector('.bottom-controls');
            const moreMusicBtn = document.querySelector('.more-music-btn');
            const musicPlayerPanel = document.getElementById('music-player-panel');
            const backBtn = document.getElementById('back-btn');
            const trackTitleEl = document.getElementById('track-title');
            const trackArtistEl = document.getElementById('track-artist');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const playerVolumeSlider = document.getElementById('player-volume-slider');

            const bg1 = document.getElementById('bg-video-1');
            const bg2 = document.getElementById('bg-video-2');
            let activeBg = bg1;
            let nextBg = bg2;
            let currentBgSrc = 'assets/background_main.mp4';
            let bgTransitionTimer = null;
            let bgTransitionId = 0;

            let mainBgTracked = false;
            const trackMainBg = () => {
                if (mainBgTracked) return;
                mainBgTracked = true;
                trackProfileAssetLoad();
            };
            bg1.addEventListener('loadeddata', trackMainBg, { once: true });
            bg1.addEventListener('error', trackMainBg, { once: true });

            bg1.src = currentBgSrc;
            bg1.play().catch(() => { });

            function forceCompleteBgTransition() {
                nextBg.style.transition = 'none';
                activeBg.style.transition = 'none';

                nextBg.style.opacity = '1';
                activeBg.style.opacity = '0';

                activeBg.pause();
                activeBg.removeAttribute('src');
                activeBg.load();
                const temp = activeBg;
                activeBg = nextBg;
                nextBg = temp;

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        activeBg.style.transition = 'opacity 1.2s ease-in-out';
                        nextBg.style.transition = 'opacity 1.2s ease-in-out';
                    });
                });

                if (bgTransitionTimer) {
                    clearTimeout(bgTransitionTimer);
                    bgTransitionTimer = null;
                }
            }

            function changeBackground(videoSrc) {
                if (videoSrc === currentBgSrc) return;

                if (bgTransitionTimer !== null) {
                    forceCompleteBgTransition();
                }

                currentBgSrc = videoSrc;
                const myTransitionId = ++bgTransitionId;

                nextBg.pause();
                nextBg.removeAttribute('src');
                nextBg.load();
                nextBg.src = videoSrc;
                nextBg.load();

                let started = false;

                const finishTransition = () => {
                    if (myTransitionId !== bgTransitionId) return;
                    if (started) return;
                    started = true;

                    nextBg.play().catch(() => { });

                    nextBg.style.opacity = '1';
                    activeBg.style.opacity = '0';

                    bgTransitionTimer = setTimeout(() => {
                        if (myTransitionId !== bgTransitionId) return;
                        bgTransitionTimer = null;

                        activeBg.pause();
                        activeBg.removeAttribute('src');
                        activeBg.load();
                        const temp = activeBg;
                        activeBg = nextBg;
                        nextBg = temp;
                    }, 1300);
                };

                if (nextBg.readyState >= 3) {
                    finishTransition();
                    return;
                }

                const fallbackTimer = setTimeout(() => {
                    if (myTransitionId !== bgTransitionId) return;
                    nextBg.removeEventListener('canplay', onCanPlay);
                    nextBg.removeEventListener('error', onError);
                    finishTransition();
                }, 8000);

                const onCanPlay = () => {
                    if (myTransitionId !== bgTransitionId) return;
                    clearTimeout(fallbackTimer);
                    nextBg.removeEventListener('canplay', onCanPlay);
                    nextBg.removeEventListener('error', onError);
                    finishTransition();
                };

                const onError = () => {
                    if (myTransitionId !== bgTransitionId) return;
                    clearTimeout(fallbackTimer);
                    nextBg.removeEventListener('canplay', onCanPlay);
                    nextBg.removeEventListener('error', onError);
                    console.error("Background load failed:", videoSrc);
                    started = true;
                    bgTransitionTimer = null;
                };

                nextBg.addEventListener('canplay', onCanPlay);
                nextBg.addEventListener('error', onError);
            }

            const audio1 = document.getElementById('music-player-1');
            const audio2 = document.getElementById('music-player-2');
            let activeAudio = audio1;
            let nextAudio = audio2;
            let targetVolume = 0.3;
            let isCrossfading = false;
            let currentTrackIndex = 0;
            let isPlaying = false;
            let isMusicMode = false;
            let bgMusicWasPlaying = false;
            let musicPlayerInitialized = false;

            audio1.volume = 0; audio2.volume = 0;

            function crossfadeToTrack(index) {
                if (!musicList.length) {
                    console.warn('[player] musicList пуст — трек не может быть запущен');
                    return;
                }
                if (isCrossfading) {
                    gsap.killTweensOf([activeAudio, nextAudio]);
                    activeAudio.pause();
                    activeAudio.currentTime = 0;
                    nextAudio.pause();
                    nextAudio.currentTime = 0;
                    nextAudio.volume = 0;
                    activeAudio.volume = targetVolume;
                    isCrossfading = false;
                }

                isCrossfading = true;
                currentTrackIndex = index;
                const track = musicList[currentTrackIndex];

                trackTitleEl.textContent = track.title;
                trackArtistEl.textContent = track.artist;
                changeBackground(track.bg);

                stopSubsChecker();

                nextAudio.src = track.audio;
                nextAudio.volume = 0;
                nextAudio.currentTime = 0;
                nextAudio.play().catch(() => { });

                gsap.to(activeAudio, {
                    volume: 0, duration: 1, ease: 'power1.inOut',
                    onComplete: () => {
                        activeAudio.pause();
                        activeAudio.currentTime = 0;
                    }
                });

                gsap.to(nextAudio, {
                    volume: targetVolume, duration: 1, ease: 'power1.inOut',
                    onComplete: () => {
                        let temp = activeAudio;
                        activeAudio = nextAudio;
                        nextAudio = temp;
                        isPlaying = true;
                        playPauseIcon.src = 'assets/pause.png';
                        isCrossfading = false;
                        startSubsChecker();
                    }
                });
            }

            let pauseCooldown = false;

            function togglePlayPause() {
                if (activeAudio.paused) {
                    activeAudio.play();
                    isPlaying = true;
                    playPauseIcon.src = 'assets/pause.png';
                    pauseCooldown = true;
                    setTimeout(() => { pauseCooldown = false; }, 1000);
                    if (subsCheckInterval) {
                        clearInterval(subsCheckInterval);
                    }
                    subsCheckInterval = setInterval(checkSubsTime, 250);
                } else {
                    if (pauseCooldown && !debugVisible) return;

                    activeAudio.pause();
                    isPlaying = false;
                    playPauseIcon.src = 'assets/play.png';
                    if (subsTimer) {
                        clearTimeout(subsTimer);
                        subsTimer = null;
                    }
                    if (subsCheckInterval) {
                        clearInterval(subsCheckInterval);
                        subsCheckInterval = null;
                    }
                    if (subsAnimationLocked) {
                        subsTextEl.classList.remove('show');
                        subsTextEl.classList.add('hide');
                        subsAnimationLocked = false;
                        setTimeout(() => {
                            subsTextEl.className = '';
                        }, 300);
                    } else {
                        subsTextEl.className = '';
                    }
                }
            }

            function playNext() {
                if (!musicList.length) return;
                let nextIndex = currentTrackIndex + 1;
                if (nextIndex >= musicList.length) nextIndex = 0;
                crossfadeToTrack(nextIndex);
            }

            function playPrev() {
                if (!musicList.length) return;
                let prevIndex = currentTrackIndex - 1;
                if (prevIndex < 0) prevIndex = musicList.length - 1;
                crossfadeToTrack(prevIndex);
            }

            function handleAudioEnded(e) {
                if (!isCrossfading && e.target === activeAudio) {
                    playNext();
                }
            }
            audio1.addEventListener('ended', handleAudioEnded);
            audio2.addEventListener('ended', handleAudioEnded);

            const subsTextEl = document.getElementById('subtitles-text');
            const SUBS_DISPLAY_DURATION = 4;
            let subsTimer = null;
            let subsCheckInterval = null;
            let currentSubsKey = null;
            let subsAnimationLocked = false;

            function getCurrentSubtitles() {
                const track = musicList[currentTrackIndex];
                return track && track.subtitles ? track.subtitles : null;
            }

            function showSubsText(key, entry) {
                if (subsAnimationLocked) {
                    subsTextEl.classList.remove('show');
                    subsTextEl.classList.add('hide');
                    currentSubsKey = key;
                    if (subsTimer) {
                        clearTimeout(subsTimer);
                        subsTimer = null;
                    }
                    setTimeout(() => {
                        subsTextEl.className = '';
                        subsTextEl.style.textShadow = '';
                        subsAnimationLocked = false;
                        currentSubsKey = null;
                        showSubsText(key, entry);
                    }, 300);
                    return;
                }

                currentSubsKey = key;
                subsAnimationLocked = true;

                let displayText, glowColor;
                if (typeof entry === 'object' && entry !== null && entry.text) {
                    displayText = entry.text;
                    glowColor = entry.glow || null;
                } else {
                    displayText = entry;
                    glowColor = null;
                }

                subsTextEl.textContent = displayText;

                if (typeof glowColor === 'string' && glowColor.trim().toLowerCase() === 'none') {
                    subsTextEl.style.textShadow = 'none';
                } else if (glowColor) {
                    subsTextEl.style.textShadow = `
                        0 0 10px ${glowColor},
                        0 0 20px ${glowColor},
                        0 0 40px ${glowColor},
                        0 0 80px ${glowColor}
                    `;
                } else {
                    subsTextEl.style.textShadow = '';
                }

                subsTextEl.className = '';
                void subsTextEl.offsetWidth;
                subsTextEl.classList.add('show');

                if (subsTimer) clearTimeout(subsTimer);
                subsTimer = setTimeout(() => {
                    subsTextEl.classList.remove('show');
                    subsTextEl.classList.add('hide');
                    subsAnimationLocked = false;
                    currentSubsKey = null;
                    setTimeout(() => {
                        subsTextEl.className = '';
                        subsTextEl.style.textShadow = '';
                    }, 300);
                }, SUBS_DISPLAY_DURATION * 1000);
            }

            let subsEnabled = true;

            function checkSubsTime() {
                if (!isPlaying || isCrossfading || !subsEnabled) return;

                const subtitles = getCurrentSubtitles();
                if (!subtitles) {
                    if (currentSubsKey !== null) {
                        subsTextEl.classList.remove('show');
                        subsTextEl.classList.add('hide');
                        currentSubsKey = null;
                        setTimeout(() => { subsTextEl.className = ''; }, 300);
                    }
                    return;
                }

                const currentTime = activeAudio.currentTime;
                let triggeredKey = null;

                for (const key in subtitles) {
                    const time = parseFloat(key);
                    if (currentTime >= time && currentTime < time + 0.2) {
                        triggeredKey = key;
                        break;
                    }
                }

                if (triggeredKey && currentSubsKey !== triggeredKey) {
                    showSubsText(triggeredKey, subtitles[triggeredKey]);
                }
            }

            function startSubsChecker() {
                stopSubsChecker();
                subsCheckInterval = setInterval(checkSubsTime, 100);
            }

            function stopSubsChecker() {
                if (subsCheckInterval) {
                    clearInterval(subsCheckInterval);
                    subsCheckInterval = null;
                }
                if (subsTimer) {
                    clearTimeout(subsTimer);
                    subsTimer = null;
                }
                subsTextEl.className = '';
                subsTextEl.style.textShadow = '';
                currentSubsKey = null;
                subsAnimationLocked = false;
            }

            moreMusicBtn.addEventListener('click', () => {
                if (!musicAssetsLoaded || musicList.length === 0) {
                    musicLoadingTooltip.classList.add('visible');
                    setTimeout(() => {
                        musicLoadingTooltip.classList.remove('visible');
                    }, 2500);
                    return;
                }

                bgMusicWasPlaying = !backgroundMusic.paused;
                backgroundMusic.pause();
                isMusicMode = true;

                gsap.to(profileBlock, { y: window.innerHeight * 1.5, duration: 0.8, ease: 'power2.inOut' });
                gsap.to(bottomControls, { y: window.innerHeight * 1.5, duration: 0.8, ease: 'power2.inOut' });

                setTimeout(() => {
                    musicPlayerPanel.classList.add('slide-up');
                    backBtn.classList.add('slide-up');

                    if (!musicPlayerInitialized) {
                        crossfadeToTrack(0);
                        musicPlayerInitialized = true;
                    } else if (!isPlaying) {
                        togglePlayPause();
                    }
                }, 400);
            });

            backBtn.addEventListener('click', () => {
                if (isCrossfading) {
                    gsap.killTweensOf([activeAudio, nextAudio]);
                    activeAudio.volume = targetVolume;
                    nextAudio.pause(); nextAudio.currentTime = 0; nextAudio.volume = 0;
                    isCrossfading = false;
                }
                activeAudio.pause(); activeAudio.currentTime = 0;
                isPlaying = false;
                playPauseIcon.src = 'assets/play.png';
                stopSubsChecker();

                musicPlayerInitialized = false;
                currentBgSrc = null;
                changeBackground('assets/background_main.mp4');

                musicPlayerPanel.classList.remove('slide-up');
                backBtn.classList.remove('slide-up');

                setTimeout(() => {
                    gsap.to(profileBlock, { y: 0, duration: 0.8, ease: 'power2.inOut' });
                    gsap.to(bottomControls, {
                        y: 0, duration: 0.8, ease: 'power2.inOut',
                        onComplete: () => {
                            isMusicMode = false;
                            if (bgMusicWasPlaying) {
                                backgroundMusic.currentTime = 0;
                                backgroundMusic.play().catch(() => { });
                            }
                        }
                    });
                }, 400);
            });

            playPauseBtn.addEventListener('click', togglePlayPause);
            nextBtn.addEventListener('click', playNext);
            prevBtn.addEventListener('click', playPrev);

            playerVolumeSlider.addEventListener('input', (e) => {
                targetVolume = parseFloat(e.target.value);
                gsap.to(activeAudio, { volume: targetVolume, duration: 0.2 });
            });

            let startTextContent = ''; let startIndex = 0; let startCursorVisible = true;
            let typeWriterInterval; let typewriterComplete = false;

            function runStartScreenEffect() {
                const finalMessage = "Ну же, один клик во имя повелителя. . .";
                if (!profileAssetsLoaded) {
                    typeWriterInterval = setTimeout(runStartScreenEffect, 100);
                } else if (!typewriterComplete) {
                    if (startIndex <= finalMessage.length) {
                        startTextContent = finalMessage.slice(0, startIndex);
                        startText.textContent = startTextContent + (startCursorVisible ? '|' : ' ');
                        if (startIndex < finalMessage.length) startIndex++;
                        typeWriterInterval = setTimeout(runStartScreenEffect, 100);
                    } else {
                        typewriterComplete = true;
                        setInterval(() => {
                            startCursorVisible = !startCursorVisible;
                            startText.textContent = startTextContent + (startCursorVisible ? '|' : ' ');
                        }, 500);
                    }
                }
            }
            runStartScreenEffect();

            function handleStartScreenClick() {
                if (!profileAssetsLoaded) return;
                clearTimeout(typeWriterInterval);
                startScreen.classList.add('hidden');
                backgroundMusic.muted = false;
                backgroundMusic.currentTime = 0;
                backgroundMusic.play().catch(err => console.error("Failed to play music:", err));
                profileBlock.classList.remove('hidden');
                gsap.fromTo(profileBlock,
                    { opacity: 0, y: -50 },
                    {
                        opacity: 1, y: 0, duration: 1, ease: 'power2.out', onComplete: () => {
                            profileBlock.classList.add('profile-appear');
                            profileContainer.classList.add('orbit');
                        }
                    }
                );
                typeWriterName(); typeWriterBio();
            }

            startScreen.addEventListener('click', handleStartScreenClick);

            startScreen.addEventListener('touchstart', (e) => {
                if (!profileAssetsLoaded || !typewriterComplete) { e.preventDefault(); return; }
                handleStartScreenClick();
            });

            function initializeVisitorCounter() {
                const totalVisitors = Math.floor(Math.random() * 900000) + 100000;
                visitorCount.textContent = totalVisitors.toLocaleString();
            }
            initializeVisitorCounter(); setInterval(initializeVisitorCounter, 60);

            let currentNameIndex = 0; let name = names[currentNameIndex];
            let nameText = ''; let nameIndex = 0; let isNameDeleting = false; let nameCursorVisible = true;
            function typeWriterName() {
                if (names.length === 0 || !name) {
                    profileName.textContent = 'Lexxikka';
                    return;
                }
                if (!isNameDeleting && nameIndex < name.length) { nameText = name.slice(0, nameIndex + 1); nameIndex++; }
                else if (isNameDeleting && nameIndex > 0) { nameText = name.slice(0, nameIndex - 1); nameIndex--; }
                else if (nameIndex === name.length) { isNameDeleting = true; setTimeout(typeWriterName, 5000); return; }
                else if (nameIndex === 0) { isNameDeleting = false; currentNameIndex = (currentNameIndex + 1) % names.length; name = names[currentNameIndex]; }
                profileName.textContent = nameText + (nameCursorVisible ? '|' : ' ');
                if (Math.random() < 0.3) { profileName.classList.add('glitch'); setTimeout(() => profileName.classList.remove('glitch'), 200); }
                setTimeout(typeWriterName, isNameDeleting ? 50 : Math.floor(Math.random() * 101) + 30);
            }
            setInterval(() => { nameCursorVisible = !nameCursorVisible; profileName.textContent = nameText + (nameCursorVisible ? '|' : ' '); }, 500);

            let bioText = ''; let bioIndex = 0; let bioMessageIndex = 0; let isBioDeleting = false; let bioCursorVisible = true;
            function typeWriterBio() {
                if (quotes.length === 0) {
                    profileBio.textContent = "";
                    return;
                }
                if (!isBioDeleting && bioIndex < quotes[bioMessageIndex].length) { bioText = quotes[bioMessageIndex].slice(0, bioIndex + 1); bioIndex++; }
                else if (isBioDeleting && bioIndex > 0) { bioText = quotes[bioMessageIndex].slice(0, bioIndex - 1); bioIndex--; }
                else if (bioIndex === quotes[bioMessageIndex].length) { isBioDeleting = true; setTimeout(typeWriterBio, 2000); return; }
                else if (bioIndex === 0 && isBioDeleting) { isBioDeleting = false; bioMessageIndex = (bioMessageIndex + 1) % quotes.length; }
                profileBio.textContent = bioText + (bioCursorVisible ? '|' : ' ');
                if (Math.random() < 0.1) { profileBio.classList.add('glitch'); setTimeout(() => profileBio.classList.remove('glitch'), 200); }
                setTimeout(typeWriterBio, isBioDeleting ? 20 : Math.floor(Math.random() * 101) + 30);
            }
            setInterval(() => { bioCursorVisible = !bioCursorVisible; profileBio.textContent = bioText + (bioCursorVisible ? '|' : ' '); }, 500);

            let currentAudio = backgroundMusic; let isMuted = false;
            volumeIcon.addEventListener('click', () => {
                isMuted = !isMuted; currentAudio.muted = isMuted;
                volumeIcon.innerHTML = isMuted
                    ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>`
                    : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>`;
            });
            volumeSlider.addEventListener('input', () => {
                currentAudio.volume = volumeSlider.value; isMuted = false; currentAudio.muted = false;
                volumeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>`;
            });

            function handleTilt(e, element) {
                if (isMusicMode) return;
                const rect = element.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2; const centerY = rect.top + rect.height / 2;
                let clientX, clientY;
                if (e.type === 'touchmove') { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
                else { clientX = e.clientX; clientY = e.clientY; }
                const mouseX = clientX - centerX; const mouseY = clientY - centerY;
                const maxTilt = 15; const tiltX = (mouseY / rect.height) * maxTilt; const tiltY = -(mouseX / rect.width) * maxTilt;
                gsap.to(element, { rotationX: tiltX, rotationY: tiltY, duration: 0.3, ease: 'power2.out', transformPerspective: 1000 });
            }
            profileBlock.addEventListener('mousemove', (e) => handleTilt(e, profileBlock));
            profileBlock.addEventListener('touchmove', (e) => { e.preventDefault(); handleTilt(e, profileBlock); });
            profileBlock.addEventListener('mouseleave', () => { if (isMusicMode) return; gsap.to(profileBlock, { rotationX: 0, rotationY: 0, duration: 0.5, ease: 'power2.out' }); });
            profileBlock.addEventListener('touchend', () => { if (isMusicMode) return; gsap.to(profileBlock, { rotationX: 0, rotationY: 0, duration: 0.5, ease: 'power2.out' }); });

            profilePicture.addEventListener('click', () => {
                profileContainer.classList.remove('fast-orbit'); profileContainer.classList.remove('orbit');
                void profileContainer.offsetWidth; profileContainer.classList.add('fast-orbit');
                setTimeout(() => { profileContainer.classList.remove('fast-orbit'); void profileContainer.offsetWidth; profileContainer.classList.add('orbit'); }, 500);
            });

            const debugTimeDisplay = document.getElementById('debug-time-display');
            const debugSeekModal = document.getElementById('debug-seek-modal');
            const debugSeekInput = document.getElementById('debug-seek-input');
            const debugTimeText = document.getElementById('debug-time-text');
            let debugTimeInterval = null;
            let debugVisible = false;

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0.000';
                const s = Math.floor(seconds);
                const ms = Math.floor((seconds % 1) * 1000);
                return String(s) + '.' + String(ms).padStart(3, '0');
            }

            function updateDebugTime() {
                const audio = activeAudio;
                if (audio && audio.duration && !isNaN(audio.duration)) {
                    debugTimeText.textContent = formatTime(audio.currentTime);
                } else {
                    debugTimeText.textContent = '0.000';
                }
            }

            function showDebugTime() {
                debugVisible = true;
                debugTimeDisplay.style.display = 'flex';
                updateDebugTime();
                if (debugTimeInterval) clearInterval(debugTimeInterval);
                debugTimeInterval = setInterval(updateDebugTime, 50);
            }

            function hideDebugTime() {
                debugVisible = false;
                debugTimeDisplay.style.display = 'none';
                if (debugTimeInterval) {
                    clearInterval(debugTimeInterval);
                    debugTimeInterval = null;
                }
            }

            function openSeekModal() {
                if (!debugVisible) return;
                const audio = activeAudio;
                if (audio && audio.duration && !isNaN(audio.duration)) {
                    debugSeekInput.value = String(Math.floor(audio.currentTime));
                } else {
                    debugSeekInput.value = '0';
                }
                debugSeekModal.classList.add('open');
                debugSeekInput.focus();
                debugSeekInput.select();
            }

            function closeSeekModal() {
                debugSeekModal.classList.remove('open');
            }

            function applySeek() {
                const val = debugSeekInput.value.trim();
                if (!val) { closeSeekModal(); return; }
                const seconds = parseInt(val, 10);
                if (isNaN(seconds) || seconds < 0) { closeSeekModal(); return; }
                const audio = activeAudio;
                if (audio && audio.duration && !isNaN(audio.duration)) {
                    audio.currentTime = Math.min(seconds, audio.duration);
                }
                closeSeekModal();
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'F3' || (e.key === 'd' && e.ctrlKey && e.shiftKey)) {
                    e.preventDefault();
                    if (debugVisible) {
                        hideDebugTime();
                    } else {
                        showDebugTime();
                    }
                }
                if (e.key === 'Escape' && debugSeekModal.classList.contains('open')) {
                    closeSeekModal();
                }
                if (e.key === 'Enter' && debugSeekModal.classList.contains('open')) {
                    applySeek();
                }
            });

            debugTimeText.addEventListener('click', openSeekModal);

            document.getElementById('debug-seek-back').addEventListener('click', (e) => {
                e.stopPropagation();
                const audio = activeAudio;
                if (audio && audio.duration && !isNaN(audio.duration)) {
                    audio.currentTime = Math.max(0, audio.currentTime - 5);
                }
            });

            document.getElementById('debug-seek-forward').addEventListener('click', (e) => {
                e.stopPropagation();
                const audio = activeAudio;
                if (audio && audio.duration && !isNaN(audio.duration)) {
                    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
                }
            });

            document.getElementById('debug-seek-apply').addEventListener('click', applySeek);
            document.getElementById('debug-seek-cancel').addEventListener('click', closeSeekModal);

            document.getElementById('debug-subs-checkbox').addEventListener('change', (e) => {
                subsEnabled = !e.target.checked;
                if (!subsEnabled) {
                    if (subsTimer) {
                        clearTimeout(subsTimer);
                        subsTimer = null;
                    }
                    if (subsCheckInterval) {
                        clearInterval(subsCheckInterval);
                        subsCheckInterval = null;
                    }
                    subsTextEl.className = '';
                    subsTextEl.textContent = '';
                    currentSubsKey = null;
                    subsAnimationLocked = false;
                } else if (isPlaying) {
                    startSubsChecker();
                }
            });

            preloadProfileAssets();
        });
    </script>
</body>

</html>
