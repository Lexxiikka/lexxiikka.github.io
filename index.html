<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Underdog&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Underdog', Calibri, system-ui, sans-serif;
        }

        .home-theme #profile-block {
            border-color: #7c00ff;
        }

        .profile-container::after {
            background: radial-gradient(circle at 10px 10px,
                    var(--primary-color, #ab0c34) 23%,
                    transparent 15%);
        }

        body {
            font-synthesis: none;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hidden {
            display: none !important;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-icon {
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            color: white;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        .bottom-controls {
            position: fixed;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 20;
        }

        .voice-control-wrapper {
            position: relative;
            padding: 2px;
            background: linear-gradient(to right bottom, #2674df, #a61fd3);
            border-radius: 20px;
        }

        .voice-control {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .more-music-btn {
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .more-music-btn img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .more-music-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 820px;
            min-height: 332px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform-style: preserve-3d;
            pointer-events: auto;
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .profile-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .profile-container::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            animation: orbit 3s linear infinite;
            z-index: -1;
            filter: blur(7px);
            box-shadow: none;
        }

        .profile-container.fast-orbit::after {
            animation: fast-orbit 0.5s linear forwards;
        }

        .profile-picture {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .name-and-badges {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
            margin-bottom: 10px;
        }

        #profile-name {

            font-weight: bold;
            letter-spacing: 3px;
            color: #fff;

        .badge-group {

        .badge-container {

        .badge-container .tooltip {

            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;

            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .badge-container:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        .badge-box {

        }

        .social-icon:hover {

        }

        .round {
            border-radius: 30%;
        }

        .glitch {
            animation: glitch 0.2s ease-in-out;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 2px);
            }

            40% {
                transform: translate(-2px, -2px);
            }

            60% {
                transform: translate(2px, 2px);
            }

            80% {
                transform: translate(2px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fast-orbit {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;

        #start-text {
            font-size: 24px;
            color: #fff;
            text-align: center;
        }

        #error-toasts {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10001;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(520px, 90vw);
            pointer-events: none;
        }

        .error-toast {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(40, 0, 10, 0.92);
            border: 1px solid #ff4d6d;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            line-height: 1.4;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.35);
            pointer-events: auto;
            animation: toastIn 0.3s ease-out;
        }

        .error-toast.out {
            animation: toastOut 0.3s ease-in forwards;
        }

        .error-toast span {
            flex: 1;
            word-break: break-word;
        }

        .error-toast button {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            opacity: 0.7;
        }

        .error-toast button:hover {
            opacity: 1;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateY(-15px);
            }
        }

        @media (max-width: 700px) {
            * {
                display: none;
            }
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        let names = [];
        let quotes = [];
        let mainSoundMultiplier = 1;
        const assetCache = new Map();
        const failedAssets = [];
        const MIME = { mp4: 'video/mp4', mp3: 'audio/mpeg' };
        const cached = (src) => assetCache.get(src) ?? src;

        function parseMultiplier(value) {
            if (value === null || value === undefined || value === '') return 1;
            const num = Number(value);
            return Number.isFinite(num) && num >= 0 ? num : 1;
        }

        function clampVolume(value) {
            return Math.min(1, Math.max(0, value));
        }

        function showError(message) {
            console.error(message);
            const box = document.getElementById('error-toasts');
            if (!box) return;
            while (box.children.length >= 4) box.firstChild.remove();
            const el = document.createElement('div');
            el.className = 'error-toast';
            el.setAttribute('role', 'alert');
            const text = document.createElement('span');
            text.textContent = '\u26A0 ' + message;
            const close = document.createElement('button');
            close.textContent = '\u00D7';
            close.setAttribute('aria-label', 'Закрыть');
            const dismiss = () => { el.classList.add('out'); setTimeout(() => el.remove(), 300); };
            close.addEventListener('click', dismiss);
            setTimeout(dismiss, 12000);
            el.append(text, close);
            box.appendChild(el);
        }

        function reportAsset(src, reason) {
            if (failedAssets.includes(src)) return;
            failedAssets.push(src);
            showError(`Не удалось загрузить файл: ${src}${reason ? ' (' + reason + ')' : ''}`);
        }

        async function fetchToBlobUrl(src, onProgress = () => { }) {
            const res = await fetch(src);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const total = +res.headers.get('Content-Length') || 0;
            const reader = res.body.getReader();
            const chunks = [];
            let loaded = 0;
            for (; ;) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                if (total) onProgress(Math.min(loaded / total, 0.99));
            }
            const ext = src.split('.').pop().toLowerCase();
            const blob = new Blob(chunks, { type: MIME[ext] || res.headers.get('Content-Type') || '' });
            const url = URL.createObjectURL(blob);
            assetCache.set(src, url);
            return url;
        }

        function decodeImage(src) {
            const img = new Image();
            img.src = src;
            return img.decode().then(() => true, () => false);
        }

        function watchMedia(el, src) {
            const url = el.getAttribute('src');
            el.addEventListener('error', () => {
                if (el.getAttribute('src') === url) reportAsset(src, 'ошибка воспроизведения');
            });
        }

        async function loadTextConfig() {
            try {
                const response = await fetch('text_config.json', { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} ${response.statusText}`);
                }
                const data = await response.json();
                names = Array.isArray(data.names) ? data.names : [];
                quotes = Array.isArray(data.quotes) ? data.quotes : [];
                mainSoundMultiplier = parseMultiplier(data.sound_multiplier);
                console.log(`[text_config] Имён: ${names.length}, цитат: ${quotes.length}, множитель звука: ${mainSoundMultiplier}`);
            } catch (err) {
                console.error('[text_config] Ошибка загрузки text_config.json:', err);
                showError('Не удалось загрузить text_config.json. Тексты заменены на запасные.');
                names = ["Lexxikka"];
                quotes = ["..."];
                mainSoundMultiplier = 1;
            }
        }

        let profileAssetsLoaded = false;

        function initMedia() {
            const bgm = document.getElementById('background-music');
            const slider = document.getElementById('volume-slider');
            if (!bgm) { console.error("Media elements not found"); return; }
            const baseVolume = slider ? parseFloat(slider.value) : 0.3;
            bgm.volume = clampVolume(baseVolume * mainSoundMultiplier);
            if (typeof gsap === 'undefined') {
                showError('Не удалось загрузить библиотеку анимаций (GSAP). Обновите страницу.');
            }
        }

        async function preloadProfileAssets() {
            const startText = document.getElementById('start-text');
            const images = [
                'assets/profile.png', 'assets/developer.png', 'assets/1c.png', 'assets/py.png',
                'assets/js.png', 'assets/owner.gif', 'assets/aal.png', 'assets/staff.gif',
                'assets/telegram.png', 'assets/telegram_group.png', 'assets/discord.png',
                'assets/youtube.png', 'assets/steam.png', 'assets/c44.png',
                'assets/blog.png', 'assets/register.png', 'assets/chameleon-game.png',
                'assets/icon.png', 'assets/player.png'
            ];
            const media = [
                'assets/background_main.mp4',
                'assets/music_main.mp3'
            ];
            const jobs = [
                (set) => document.fonts.load('16px Underdog').catch(() => { }).then(() => set(1)),
                ...images.map(src => (set) => decodeImage(src).then(ok => { if (!ok) reportAsset(src); set(1); })),
                ...media.map(src => (set) => fetchToBlobUrl(src, set)
                    .catch(err => reportAsset(src, err.message)).then(() => set(1)))
            ];
            const progress = new Array(jobs.length).fill(0);
            const render = () => {
                const pct = Math.floor(progress.reduce((a, b) => a + b, 0) / jobs.length * 100);
                startText.textContent = `Идет подгрузка контента страницы ${pct}%`;
            };
            await Promise.all(jobs.map((job, i) => job(v => { progress[i] = v; render(); })));

            const bg1 = document.getElementById('bg-video-1');
            const bgm = document.getElementById('background-music');
            bg1.src = cached('assets/background_main.mp4');
            watchMedia(bg1, 'assets/background_main.mp4');
            bg1.play().catch(() => { });
            bgm.src = cached('assets/music_main.mp3');
            watchMedia(bgm, 'assets/music_main.mp3');

            profileAssetsLoaded = true;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadTextConfig();

            initMedia();
            const startScreen = document.getElementById('start-screen');
            const startText = document.getElementById('start-text');
            const profileName = document.getElementById('profile-name');
            const profileBio = document.getElementById('profile-bio');
            const visitorCount = document.getElementById('visitor-count');
            const backgroundMusic = document.getElementById('background-music');
            const volumeIcon = document.getElementById('volume-icon');
            const volumeSlider = document.getElementById('volume-slider');
            const profileBlock = document.getElementById('profile-block');
            const profilePicture = document.querySelector('.profile-picture');
            const profileContainer = document.querySelector('.profile-container');

            let startTextContent = '';
            let startIndex = 0;
            let startCursorVisible = true;
            let typeWriterInterval;
            let typewriterComplete = false;

            function runStartScreenEffect() {
                const finalMessage = "Ну же, один клик во имя повелителя. . .";
                if (!profileAssetsLoaded) {
                    typeWriterInterval = setTimeout(runStartScreenEffect, 100);
                } else if (!typewriterComplete) {
                    if (startIndex <= finalMessage.length) {
                        startTextContent = finalMessage.slice(0, startIndex);
                        startText.textContent = startTextContent + (startCursorVisible ? '|' : ' ');
                        if (startIndex < finalMessage.length) startIndex++;
                        typeWriterInterval = setTimeout(runStartScreenEffect, 100);
                    } else {
                        typewriterComplete = true;
                        setInterval(() => {
                            startCursorVisible = !startCursorVisible;
                            startText.textContent = startTextContent + (startCursorVisible ? '|' : ' ');
                        }, 500);
                    }
                }
            }
            runStartScreenEffect();

            function handleStartScreenClick() {
                if (!profileAssetsLoaded) return;
                clearTimeout(typeWriterInterval);
                startScreen.classList.add('hidden');
                backgroundMusic.muted = false;
                backgroundMusic.currentTime = 0;
                backgroundMusic.play().catch(err => console.error("Failed to play music:", err));
                profileBlock.classList.remove('hidden');
                gsap.fromTo(profileBlock,
                    { opacity: 0, y: -50 },
                    {
                        opacity: 1, y: 0, duration: 1, ease: 'power2.out', onComplete: () => {
                            profileBlock.classList.add('profile-appear');
                            profileContainer.classList.add('orbit');
                        }
                    }
                );
                typeWriterName();
                typeWriterBio();
            }

            startScreen.addEventListener('click', handleStartScreenClick);

            startScreen.addEventListener('touchstart', (e) => {
                if (!profileAssetsLoaded || !typewriterComplete) { e.preventDefault(); return; }
                handleStartScreenClick();
            });

            function initializeVisitorCounter() {
                const totalVisitors = Math.floor(Math.random() * 900000) + 100000;
                visitorCount.textContent = totalVisitors.toLocaleString();
            }
            initializeVisitorCounter();
            setInterval(initializeVisitorCounter, 60);

            let currentNameIndex = 0;
            let name = names[currentNameIndex];
            let nameText = '';
            let nameIndex = 0;
            let isNameDeleting = false;
            let nameCursorVisible = true;

            function typeWriterName() {
                if (names.length === 0 || !name) {
                    profileName.textContent = 'Lexxikka';
                    return;
                }
                if (!isNameDeleting && nameIndex < name.length) {
                    nameText = name.slice(0, nameIndex + 1);
                    nameIndex++;
                } else if (isNameDeleting && nameIndex > 0) {
                    nameText = name.slice(0, nameIndex - 1);
                    nameIndex--;
                } else if (nameIndex === name.length) {
                    isNameDeleting = true;
                    setTimeout(typeWriterName, 5000);
                    return;
                } else if (nameIndex === 0) {
                    isNameDeleting = false;
                    currentNameIndex = (currentNameIndex + 1) % names.length;
                    name = names[currentNameIndex];
                }
                profileName.textContent = nameText + (nameCursorVisible ? '|' : ' ');
                if (Math.random() < 0.3) {
                    profileName.classList.add('glitch');
                    setTimeout(() => profileName.classList.remove('glitch'), 200);
                }
                setTimeout(typeWriterName, isNameDeleting ? 50 : Math.floor(Math.random() * 101) + 30);
            }
            setInterval(() => {
                nameCursorVisible = !nameCursorVisible;
                profileName.textContent = nameText + (nameCursorVisible ? '|' : ' ');
            }, 500);

            let bioText = '';
            let bioIndex = 0;
            let bioMessageIndex = 0;
            let isBioDeleting = false;
            let bioCursorVisible = true;

            function typeWriterBio() {
                if (quotes.length === 0) {
                    profileBio.textContent = "";
                    return;
                }
                if (!isBioDeleting && bioIndex < quotes[bioMessageIndex].length) {
                    bioText = quotes[bioMessageIndex].slice(0, bioIndex + 1);
                    bioIndex++;
                } else if (isBioDeleting && bioIndex > 0) {
                    bioText = quotes[bioMessageIndex].slice(0, bioIndex - 1);
                    bioIndex--;
                } else if (bioIndex === quotes[bioMessageIndex].length) {
                    isBioDeleting = true;
                    setTimeout(typeWriterBio, 2000);
                    return;
                } else if (bioIndex === 0 && isBioDeleting) {
                    isBioDeleting = false;
                    bioMessageIndex = (bioMessageIndex + 1) % quotes.length;
                }
                profileBio.textContent = bioText + (bioCursorVisible ? '|' : ' ');
                if (Math.random() < 0.1) {
                    profileBio.classList.add('glitch');
                    setTimeout(() => profileBio.classList.remove('glitch'), 200);
                }
                setTimeout(typeWriterBio, isBioDeleting ? 20 : Math.floor(Math.random() * 101) + 30);
            }
            setInterval(() => {
                bioCursorVisible = !bioCursorVisible;
                profileBio.textContent = bioText + (bioCursorVisible ? '|' : ' ');
            }, 500);

            let isMuted = false;
            volumeIcon.addEventListener('click', () => {
                isMuted = !isMuted;
                backgroundMusic.muted = isMuted;
                volumeIcon.innerHTML = isMuted
                    ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>`
                    : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>`;
            });
            volumeSlider.addEventListener('input', () => {
                backgroundMusic.volume = clampVolume(parseFloat(volumeSlider.value) * mainSoundMultiplier);
                isMuted = false;
                backgroundMusic.muted = false;
                volumeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>`;
            });

            function handleTilt(e, element) {
                const rect = element.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                let clientX, clientY;
                if (e.type === 'touchmove') {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                const mouseX = clientX - centerX;
                const mouseY = clientY - centerY;
                const maxTilt = 15;
                const tiltX = (mouseY / rect.height) * maxTilt;
                const tiltY = -(mouseX / rect.width) * maxTilt;
                gsap.to(element, { rotationX: tiltX, rotationY: tiltY, duration: 0.3, ease: 'power2.out', transformPerspective: 1000 });
            }
            profileBlock.addEventListener('mousemove', (e) => handleTilt(e, profileBlock));
            profileBlock.addEventListener('touchmove', (e) => { e.preventDefault(); handleTilt(e, profileBlock); });
            profileBlock.addEventListener('mouseleave', () => { gsap.to(profileBlock, { rotationX: 0, rotationY: 0, duration: 0.5, ease: 'power2.out' }); });
            profileBlock.addEventListener('touchend', () => { gsap.to(profileBlock, { rotationX: 0, rotationY: 0, duration: 0.5, ease: 'power2.out' }); });

            profilePicture.addEventListener('click', () => {
                profileContainer.classList.remove('fast-orbit');
                profileContainer.classList.remove('orbit');
                void profileContainer.offsetWidth;
                profileContainer.classList.add('fast-orbit');
                setTimeout(() => {
                    profileContainer.classList.remove('fast-orbit');
                    void profileContainer.offsetWidth;
                    profileContainer.classList.add('orbit');
                }, 500);
            });

            preloadProfileAssets();
        });
    </script>
</body>

</html>
